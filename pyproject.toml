[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slaython"
dynamic = ["version"]
description = "Python, but the keywords are gen-z slang. Fully interoperable with Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "memoliertorerr" }]
keywords = ["language", "transpiler", "slang", "gen-z", "esolang", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: IPython",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]

[project.optional-dependencies]
jupyter = ["ipykernel>=6.0", "jupyter_client>=7.0"]

[project.urls]
Homepage = "https://github.com/memoliertorerr/Slaython"
Playground = "https://memoliertorerr.github.io/Slaython/"
Source = "https://github.com/memoliertorerr/Slaython"
Issues = "https://github.com/memoliertorerr/Slaython/issues"

[project.scripts]
slaython = "slaython.cli:main"
slay = "slaython.cli:main"

[tool.setuptools]
packages = ["slaython"]

[tool.setuptools.dynamic]
version = { attr = "slaython.__version__" }
